  finding: >-
    Aflac declares NO industry data standard in its contract layer. It ships something unusual
    instead: a complete, publicly documented PROPRIETARY canonical model — EDS (Enterprise Data
    Structures) v2020, ~90 canonicals across 20 libraries — that is mandatory across every API
    layer and governs what a REST collection may even be named. That is real interoperability
    discipline, but it is Aflac-internal, so a partner who already speaks ACORD still needs a
    bilateral mapping. Recorded as a fact, not scored as a domain-standard conformance:
    domain_standard_conformance is reward-only and nothing here earns it.
  see: data-model/aflac-data-model.yml

