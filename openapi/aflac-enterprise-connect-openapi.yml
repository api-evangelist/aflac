    Claim:
      type: object
      description: A supplemental insurance claim record.
      properties:
        claim_id:
          type: string
          description: Unique claim identifier.
          example: CLM-112233
        policy_id:
          type: string
          description: Policy associated with the claim.
          example: POL-987654
        employee_id:
          type: string
          description: Claimant employee identifier.
          example: EMP-789012
        claim_type:
          type: string
          description: Type of claim event.
          enum:
          - accident
          - critical_illness
          - cancer_diagnosis
          - hospitalization
          - disability
          example: accident
        status:
          type: string
          description: Current claim processing status.
          enum:
          - submitted
          - in_review
          - approved
          - denied
          - paid
          example: approved
        incident_date:
          type: string
          format: date
