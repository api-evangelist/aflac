        product_type:
          type: string
          description: Type of supplemental insurance product.
          example: accident
        status:
          type: string
          description: Policy status.
          enum:
          - active
          - lapsed
          - terminated
          example: active
        face_value:
          type: number
          description: Coverage face value amount in USD.
