owner: IC4E team (Integration Center for Excellence), Aflac
summary: >-
  Aflac publishes its enterprise canonical data model in full and openly. EDS is mandatory: request
  and response payloads between the Experience, Process and System API layers must conform to it,
  and the entity name used for any new REST collection must already exist in EDS. This is a genuine
  first-party enterprise data model for supplemental insurance — accounts, insurance agreements,
  claims, producers, products and financials — not a derivation from a specification we authored.

union_type:
  name: aflac-canonicals-payload
  description: >-
    The union of all available canonicals representing Aflac business entities, designed to be
    all-inclusive. Each element is an optional array, so one payload can carry any combination of
    entities. This is the practical entry point to the whole model.

libraries:
- library: base-library
  group: support
  purpose: >-
    Foundational, highly generic building blocks reused across every business domain.
  entities: [address, basic-questions-set, contact-base, contact-information, email-address, field,
    habit, language, master-key, named-fields-set, named-selection, named-selections-set,
    persisted-payload, person-name, phone, recursively-nested-flexible-object, relationship, skill,
    social-media-account, source, split-line, super-business-entity, typed-name-value-pair, version]
- library: api-specific
  group: support
  purpose: Structures applied to API payloads rather than held in EDS itself.
  entities: [aflac-canonicals-payload, general-response, metadata, pagination-info,
    application-service-message]
  note: >-
    general-response, metadata, pagination-info and application-service-message are explicitly NOT
    EDS structures — they are the API envelope. See errors/aflac-problem-types.yml.
- library: canonical-constants
  group: support
  purpose: Shared constant definitions across canonicals.
  entities: [canonical-constants]
- library: utility-library
  group: support
  purpose: Helper utilities for traversing related entities.
  entities: [relatedentityutil]
- library: account-library
  group: aflac-business
  purpose: Employer/group account, its contract and its proposal.
  entities: [account, account-contract, account-proposal, funding-info, account-enums]
- library: claim-library
  group: aflac-business
  purpose: The claim domain.
  entities: [claim, claim-line, claim-line-grouping, claimable-event, claim-enums]
  vocabulary:
    claimant: The entity named in an insurance-agreement as the covered person.
    beneficiary: The entity named in an insurance-agreement that receives the proceeds of a claim.
    participant: >-
      An entity that takes part in a claimable-event — for example, if an ambulance transports the
      claimant, both the claimant and the ambulance organization are participants.
- library: insurance-agreement-library
  group: aflac-business
