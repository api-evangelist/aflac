conventions:
  attribute_naming: kebab-case throughout (page-number, short-description, claim-line-grouping)
  collection_naming: >-
    Every REST collection name must correspond to an entity that exists in EDS 2026; if the entity
    should exist but does not, teams must raise it with the IC4E team.
  deprecation_marking: >-
    Superseded fields are marked in place rather than removed — contact-information is "@Deprecated
    in the Java VO, use individual contact elements directly"; funding-info is deprecated in favour
    of premium-collection-method and payment-method inside the account canonical's
    configurable-attributes; email-address carries a deprecated field whose preference-index moved
    into the address VO.

not_published:
- Field-level JSON Schema or machine-readable EDS artifacts (the model is published as HTML documentation).
- Id-prefix scheme or identifier format per entity.
coverage_note: >-
  Entity inventory and relationships above are taken verbatim from Aflac's published library
  overviews and its own worked examples. Relationships not evidenced by a published statement or
  example have been left out rather than guessed at from entity names.
