# Negative probe result — recorded deliberately.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file IS that artifact. It makes repo_has?(slug,'llms')
# true so the unprobed-pointer fallback stops firing, while carrying no .txt so
# llms_txt_present? stays false. The check therefore returns a TRUE zero, backed
# by a fetched URL and a status code, instead of a false credit.
#
# Same posture as the well-known probe artifacts: a recorded absence is a valid
# measurement. Do not delete this to 'clean up' — deleting it restores the bug.
llms:
  probed: '2026-08-17'
  url: https://docs.enterprise-connect.aflac.com/llms.txt
  verdict: soft-404
  published: false
  http_status: 200
  content_type: text/html
  bytes: 12025
  note: >-
    HTTP 200 serving HTML, not a text llms.txt. A 200 is not evidence.
  re-probed: '2026-09-04'
  reprobe_status: 200
  reprobe_content_type: text/html
  reprobe_bytes: 12025
  reprobe_verdict: soft-404
  reprobe_note: >-
    Unchanged. The docs host is an Angular SPA whose catch-all returns the SAME 12,025-byte
    application shell for EVERY unknown path — /llms.txt, /openapi.json, /swagger.json and every
    /.well-known/* path all return byte-identical bodies. The apis.yml LlmsText pointer at this URL
    was removed on 2026-09-04 because it asserted a document that is not served. No generated
    llms.txt has been written into llms/ either: a .txt in this directory makes llms_txt_present?
    true, which reads as the PROVIDER publishing one. Aflac does not.
