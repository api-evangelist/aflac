description: >-
  Aflac is America's leading provider of supplemental insurance, offering products that pay benefits when a policyholder
  experiences an accident, illness, or injury. Aflac provides REST APIs through its Enterprise Connect (AEC) platform
  enabling benefits technology companies, HR platforms, and benefits administrators to integrate supplemental insurance
  enrollment, policy management, and claims capabilities into their workflows.
