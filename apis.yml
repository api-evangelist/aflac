  properties:
  - url: https://docs.enterprise-connect.aflac.com
    type: Documentation
  description: >-
    The Aflac Claims API provides programmatic access to supplemental insurance claim submission, status
    retrieval, and benefit payment tracking. It enables policyholders and administrators to submit claims
    digitally, track claim processing status, and receive benefit payment notifications. The API supports
    claims for Aflac's portfolio of supplemental products including accident, critical illness, cancer,
    hospital indemnity, and short-term disability insurance.
