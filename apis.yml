description: >-
  Aflac is America's leading provider of supplemental insurance, paying benefits when a policyholder has an accident,
  illness, or injury. Aflac runs its own integration-API platform, Aflac Enterprise Connect (AEC), on AWS API Gateway in
  front of Java and .NET services, and publishes the platform's design rules openly at docs.enterprise-connect.aflac.com:
  a layered service taxonomy (experience, process, core, system, aspect), a strict resource-path grammar, a mandated
  general-response envelope, a mandatory health endpoint on every API, and a complete enterprise canonical data model
  (EDS v2020, roughly 90 canonicals across 20 libraries). The portal is written for Aflac application teams, not outside
  partners: the service catalog, Swagger console and spec builder sit behind a PingIdentity login, OAuth 2.0
  client-credentials is the only supported authentication, and credentials are issued by internal request. The design
  documentation is public; the contracts and endpoints are not.
