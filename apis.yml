  - type: Features
    data:
      - name: Electronic Benefits Enrollment
        description: >-
          Replace EDI 834 file-based enrollment with real-time API-driven enrollment workflows for supplemental
          insurance products.
      - name: Policy Administration
        description: >-
          Manage group and individual supplemental insurance policies including enrollments, terminations, and coverage
          changes.
      - name: Claims Submission
        description: >-
          Enable digital claim filing for supplemental insurance products including accident, critical illness, cancer,
          and disability coverage.
      - name: Eligibility Verification
        description: Verify employee eligibility for Aflac supplemental insurance products in real time during enrollment.
      - name: Benefits Administration Integration
        description: >-
          Connect benefits administration platforms with Aflac's enrollment and policy systems via standardized REST
          APIs.
      - name: Real-Time Enrollment Confirmation
        description: Receive immediate enrollment confirmation and policy numbers upon successful enrollment submission.
  - type: UseCases
    data:
      - name: HR Platform Integration
        description: >-
          HR and benefits administration platforms integrate with Aflac's API to offer supplemental insurance enrollment
          within their existing benefits workflows.
      - name: Employer Self-Service Enrollment
        description: >-
          Employers manage supplemental insurance enrollments for employees during open enrollment periods via connected
          benefits platforms.
      - name: Claims Tracking
        description: >-
          Employees and HR teams track the status of Aflac supplemental insurance claims submitted after a qualifying
          health event.
      - name: Benefits Broker Workflow
        description: >-
          Benefits brokers manage group policy setup, employee enrollment, and plan changes for employer clients through
          integrated tools.
  - type: Integrations
    data:
      - name: Employee Navigator
        description: >-
          Aflac connects with Employee Navigator benefits administration platform for automated enrollment data
          exchange.
      - name: Benefitfocus
        description: Integration with Benefitfocus benefits marketplace for supplemental insurance enrollment.
      - name: ADP
        description: Payroll and HR integration with ADP for Aflac premium deduction and enrollment synchronization.
      - name: Workday
        description: Enterprise HR platform integration for benefits enrollment and Aflac policy administration.
      - name: bswift
        description: Benefits administration platform integration for Aflac group enrollment.
