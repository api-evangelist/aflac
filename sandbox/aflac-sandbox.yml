source: >-
  Aflac Enterprise Connect developer portal, https://docs.enterprise-connect.aflac.com —
  /docs/developer-guide/how-to-guides/how-to-make-a-request-using-swagger (Developer Portal in Dev
  and Syst), /docs/developer-guide/how-to-guides/how-to-check-the-health-endpoint-of-your-service,
  /docs/platform-overview/approach-to-test-automation,
  /docs/developer-guide/app-team-controls/test-automation, and the environment host mapping
