specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: aflac
providerId: aflac
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: Aflac bills via insurance premiums (state-filed) and broker/employer integration fees;
  it does not bill per API call.
tags:
  - FinOps
  - FOCUS
  - Insurance
  - Voluntary Benefits
description: 'FOCUS-aligned FinOps for Aflac: premium-based insurance billing for supplemental
  policies plus broker/employer integration agreements.'
sources:
  - https://www.aflac.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Aflac Incorporated
serviceCategory: Insurance / Supplemental Benefits
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Refund
    - Adjustment
focusColumns:
  ServiceName: Aflac
  ServiceCategory: Insurance / Supplemental Benefits
  ProviderName: Aflac
  PublisherName: Aflac Incorporated
  InvoiceIssuerName: Aflac Incorporated
  BillingCurrency: USD
meters:
  - name: active_policies
    unit: policy
    aggregation: max
    dimensions:
      - product
      - state
      - employer
  - name: monthly_premiums
    unit: USD
    aggregation: sum
    dimensions:
      - product
      - state
  - name: claims_paid
    unit: USD
    aggregation: sum
    dimensions:
      - product
      - state
  - name: broker_integration_fees
    unit: USD
    aggregation: sum
    dimensions:
      - partner
principles:
  - name: Visibility
    description: Track active-policy counts and premium volume via the Aflac employer/broker
      portal; reconcile against payroll deductions.
  - name: Allocation
    description: Tag premiums by employer group, division, and product line for benefits cost
      reporting.
  - name: Optimization
    description: Review benefit utilization and renewal pricing annually; right-size product
      offerings by employee segment.
  - name: Accountability
    description: Assign benefits-program owner; review enrollment, premium, and claim variance
      monthly.
