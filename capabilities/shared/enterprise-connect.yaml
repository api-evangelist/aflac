naftiko: "1.0.0-alpha1"

info:
  label: "Aflac Enterprise Connect API"
  description: "Shared capability definition for the Aflac Enterprise Connect API covering enrollment, policy, claims, eligibility, and group management."
  tags:
    - Aflac
    - Benefits
    - Enrollment
    - Insurance
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AFLAC_CLIENT_ID: AFLAC_CLIENT_ID
      AFLAC_CLIENT_SECRET: AFLAC_CLIENT_SECRET

capability:
  consumes:
    - type: http
      namespace: aflac-enterprise-connect
      baseUri: https://api.enterprise-connect.aflac.com/v1
      description: "Aflac Enterprise Connect API for benefits enrollment and policy management."
      authentication:
        type: bearer
        token: "{{AFLAC_ACCESS_TOKEN}}"
      resources:
        - name: enrollments
          path: /enrollments
          description: "Benefits enrollment management."
          operations:
            - name: list-enrollments
              method: GET
              description: "List benefit enrollments."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-enrollment
              method: POST
              description: "Create a new benefit enrollment."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: enrollment-by-id
          path: /enrollments/{enrollment_id}
          description: "Operations on a specific enrollment."
          operations:
            - name: get-enrollment
              method: GET
              description: "Retrieve an enrollment by ID."
              inputParameters:
                - name: enrollment_id
                  in: path
                  type: string
                  required: true
                  description: "Enrollment identifier."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: claims
          path: /claims
          description: "Claims management."
          operations:
            - name: list-claims
              method: GET
              description: "List claims."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: submit-claim
              method: POST
              description: "Submit a new claim."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: eligibility
          path: /eligibility/verify
          description: "Eligibility verification."
          operations:
            - name: verify-eligibility
              method: POST
              description: "Verify employee eligibility for a supplemental insurance product."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: aflac-enterprise-api
      resources:
        - path: /v1/enrollments
          name: enrollments
          description: "Enrollment management."
          operations:
            - method: GET
              name: list-enrollments
              description: "List enrollments."
              call: "aflac-enterprise-connect.list-enrollments"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: aflac-enterprise-mcp
      transport: http
      tools:
        - name: list-enrollments
          description: "List Aflac benefit enrollments."
          hints:
            readOnly: true
            destructive: false
          call: "aflac-enterprise-connect.list-enrollments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-enrollment
          description: "Create a new Aflac benefit enrollment."
          hints:
            readOnly: false
            destructive: false
          call: "aflac-enterprise-connect.create-enrollment"
          outputParameters:
            - type: object
              mapping: "$."
        - name: submit-claim
          description: "Submit a supplemental insurance claim."
          hints:
            readOnly: false
            destructive: false
          call: "aflac-enterprise-connect.submit-claim"
          outputParameters:
            - type: object
              mapping: "$."
        - name: verify-eligibility
          description: "Verify employee eligibility for Aflac supplemental insurance."
          hints:
            readOnly: true
            destructive: false
          call: "aflac-enterprise-connect.verify-eligibility"
          outputParameters:
            - type: object
              mapping: "$."
