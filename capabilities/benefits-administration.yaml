naftiko: "1.0.0-alpha1"

info:
  label: "Aflac Benefits Administration"
  description: "Unified workflow capability for Aflac supplemental insurance benefits administration covering enrollment, claims, eligibility, and policy management. Used by HR platform engineers and benefits administrators."
  tags:
    - Aflac
    - Benefits
    - Insurance
    - Enrollment
    - Claims
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AFLAC_CLIENT_ID: AFLAC_CLIENT_ID
      AFLAC_CLIENT_SECRET: AFLAC_CLIENT_SECRET
      AFLAC_ACCESS_TOKEN: AFLAC_ACCESS_TOKEN

capability:
  consumes:
    - import: aflac-enterprise-connect
      location: ./shared/enterprise-connect.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: aflac-benefits-api
      description: "Unified REST API for Aflac supplemental insurance benefits administration."
      resources:
        - path: /v1/enrollments
          name: enrollments
          description: "Benefit enrollment management."
          operations:
            - method: GET
              name: list-enrollments
              description: "List benefit enrollments."
              call: "aflac-enterprise-connect.list-enrollments"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-enrollment
              description: "Create a new enrollment."
              call: "aflac-enterprise-connect.create-enrollment"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/enrollments/{enrollment_id}
          name: enrollment-by-id
          description: "Specific enrollment operations."
          operations:
            - method: GET
              name: get-enrollment
              description: "Retrieve an enrollment."
              call: "aflac-enterprise-connect.get-enrollment"
              with:
                enrollment_id: "rest.enrollment_id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/claims
          name: claims
          description: "Claims management."
          operations:
            - method: GET
              name: list-claims
              description: "List claims."
              call: "aflac-enterprise-connect.list-claims"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: submit-claim
              description: "Submit a claim."
              call: "aflac-enterprise-connect.submit-claim"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/eligibility/verify
          name: eligibility
          description: "Eligibility verification."
          operations:
            - method: POST
              name: verify-eligibility
              description: "Verify employee eligibility."
              call: "aflac-enterprise-connect.verify-eligibility"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9090
      namespace: aflac-benefits-mcp
      transport: http
      description: "MCP server for AI-assisted Aflac supplemental insurance benefits administration."
      tools:
        - name: list-enrollments
          description: "List Aflac supplemental insurance benefit enrollments for a group or employee."
          hints:
            readOnly: true
            destructive: false
          call: "aflac-enterprise-connect.list-enrollments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-enrollment
          description: "Enroll an employee in an Aflac supplemental insurance product."
          hints:
            readOnly: false
            destructive: false
          call: "aflac-enterprise-connect.create-enrollment"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-enrollment
          description: "Retrieve a specific Aflac enrollment record."
          hints:
            readOnly: true
            destructive: false
          call: "aflac-enterprise-connect.get-enrollment"
          with:
            enrollment_id: "tools.enrollment_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-claims
          description: "List Aflac supplemental insurance claims."
          hints:
            readOnly: true
            destructive: false
          call: "aflac-enterprise-connect.list-claims"
          outputParameters:
            - type: object
              mapping: "$."
        - name: submit-claim
          description: "Submit an Aflac supplemental insurance claim for a qualifying event."
          hints:
            readOnly: false
            destructive: false
          call: "aflac-enterprise-connect.submit-claim"
          outputParameters:
            - type: object
              mapping: "$."
        - name: verify-eligibility
          description: "Verify an employee's eligibility for an Aflac supplemental insurance product."
          hints:
            readOnly: true
            destructive: false
          call: "aflac-enterprise-connect.verify-eligibility"
          outputParameters:
            - type: object
              mapping: "$."
